[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty50-ta-regression"
version = "0.1.0"
description = "Reproducible forecasting of next-session and fifth-session NSE closing prices for Nifty 50 stocks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightgbm==4.6.0",
  "numpy==2.2.6",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]
